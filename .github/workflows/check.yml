# PR마다 블로그 타입·테스트(빌드 포함)를 확인한다(MID-317). 배포는 하지 않는다
# 기준: blox-code-lol .github/workflows/check.yml. pnpm 모노레포라 다른 곳은 deploy-blog.yml과 같은 이유다
name: Check blog

on:
  pull_request:
    paths:
      - 'apps/blog/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm --filter blog check-types
      # test가 `astro build` 뒤 vitest를 돌리므로 빌드 단계를 따로 두지 않는다
      - name: 테스트
        run: pnpm --filter blog test
